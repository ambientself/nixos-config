name: secrets

on:
  push:
  pull_request:

# The pre-commit hook can be skipped with --no-verify, and this repository is
# public, so the same check runs here where it cannot be bypassed.
jobs:
  no-plaintext-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every file on a secret path is sops-encrypted
        run: ./scripts/check-secrets-encrypted.sh

      # A guard that has never refused anything has not been tested. This
      # proves the check still fails on a plaintext secret, on every run.
      - name: the check actually refuses a plaintext secret
        run: |
          set -u
          printf 'token: hunter2\n' > secrets/positive-control.yaml
          if ./scripts/check-secrets-encrypted.sh secrets/positive-control.yaml; then
            echo "::error::the secrets check PASSED a plaintext file; it is not protecting anything"
            rm -f secrets/positive-control.yaml
            exit 1
          fi
          rm -f secrets/positive-control.yaml
          echo "positive control ok: plaintext was refused"
